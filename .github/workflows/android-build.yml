# بناء واختبار THE LAST MEMORY آلياً
#
# وظيفتان: test ثم build. البناء لا يعمل إن أخفق اختبار واحد.
# يعمل تلقائياً عند تغيّر ملفات اللعبة، ويدوياً عند الطلب،
# وينشئ إصداراً في GitHub Releases عند دفع وسم يبدأ بـ v.

name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'src/**'
      - 'levels/**'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/android-build.yml'

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  test:
    name: اختبارات آلية
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: استرجاع Godot من الذاكرة المؤقتة
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: تنزيل Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: تشغيل الاختبارات
        run: |
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --version
          bash tests/run.sh

  build:
    name: بناء APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        # خوادم ubuntu تحمل الـ SDK مثبّتاً أصلاً. إضافة setup-android@v3
        # تفشل لأنها تحاول تثبيت حزمة 'tools' المحذوفة من SDK الحديث،
        # فنستخدم sdkmanager المثبّت مباشرة مع اكتشاف مساره ديناميكياً.
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "::error::مجلد Android SDK غير موجود: $SDK"; exit 1; }
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          test -n "$SDKMGR" || { echo "::error::sdkmanager غير موجود تحت $SDK"; exit 1; }
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/build-tools" "$SDK/platform-tools" | head

      - name: استرجاع Godot من الذاكرة المؤقتة
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: تنزيل Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: استرجاع قوالب التصدير
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: تنزيل قوالب التصدير
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/

      - name: ربط Godot بالـ SDK و JDK وتوليد مفتاح التوقيع
        # Godot لا يقرأ ANDROID_HOME، بل إعداد المحرر حصراً.
        # و --quit وحده لا يولّد ملف الإعدادات، لذا نكتبه نحن.
        # مُتحقَّق محلياً: ملف بخمسة أسطر يكفي، وGodot يملأ الباقي افتراضياً.
        run: |
          set -e
          CFG_DIR="$HOME/.config/godot"
          CFG="$CFG_DIR/editor_settings-${GODOT_VERSION%.*}.tres"
          KS="$HOME/.local/share/godot/keystores/debug.keystore"
          mkdir -p "$CFG_DIR" "$(dirname "$KS")"
          if [ ! -f "$KS" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$KS" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
              -deststoretype pkcs12
          fi
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$KS\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' \
            > "$CFG"
          echo "--- $CFG ---"
          cat "$CFG"

      - name: تسخين ذاكرة الاستيراد
        run: |
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --path . --import

      - name: تصدير APK
        run: |
          set -e
          export PATH="$HOME/godot-bin:$PATH"
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/the_last_memory.apk
          test -s build/android/the_last_memory.apk \
            || { echo "::error::لم يُنتَج ملف APK"; exit 1; }
          ls -lh build/android/

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: the-last-memory-apk
          path: build/android/the_last_memory.apk
          retention-days: 90

