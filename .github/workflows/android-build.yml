# بناء واختبار THE LAST MEMORY آلياً
#
# وظيفتان: test ثم build. البناء لا يعمل إن أخفق اختبار واحد.
# يعمل تلقائياً عند تغيّر ملفات اللعبة، ويدوياً عند الطلب،
# وينشئ إصداراً في GitHub Releases عند دفع وسم يبدأ بـ v.

name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main] # فرع دمج الغابة يُبنى عبر forest-preview-android.yml
    tags: ['v*']

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  test:
    name: اختبارات آلية
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: استرجاع Godot من الذاكرة المؤقتة
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: تنزيل Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: تشغيل الاختبارات
        run: |
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --version
          bash tests/run.sh

  build:
    name: بناء APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        # خوادم ubuntu تحمل الـ SDK مثبّتاً أصلاً. إضافة setup-android@v3
        # تفشل لأنها تحاول تثبيت حزمة 'tools' المحذوفة من SDK الحديث،
        # فنستخدم sdkmanager المثبّت مباشرة مع اكتشاف مساره ديناميكياً.
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK" || { echo "::error::مجلد Android SDK غير موجود: $SDK"; exit 1; }
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          test -n "$SDKMGR" || { echo "::error::sdkmanager غير موجود تحت $SDK"; exit 1; }
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/build-tools" "$SDK/platform-tools" | head

      - name: استرجاع Godot من الذاكرة المؤقتة
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-linux

      - name: تنزيل Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p ~/godot-bin
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${TAG}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: استرجاع قوالب التصدير
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: تنزيل قوالب التصدير
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz"
          unzip -q templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/

      - name: ربط Godot بالـ SDK و JDK والمفتاح الثابت
        # Godot لا يقرأ ANDROID_HOME، بل إعداد المحرر حصراً.
        # و --quit وحده لا يولّد ملف الإعدادات، لذا نكتبه نحن.
        #
        # مهم: المفتاح لم يعد يُولَّد هنا. توليده في كل بناء كان ينتج
        # توقيعاً مختلفاً كل مرة، وأندرويد يرفض تحديث تطبيق مثبّت
        # بتوقيع مختلف برسالة «الحزمة غير صحيحة». المفتاح الآن ملف
        # ثابت داخل المستودع: ci/thelastmemory.keystore
        run: |
          set -e
          CFG_DIR="$HOME/.config/godot"
          CFG="$CFG_DIR/editor_settings-${GODOT_VERSION%.*}.tres"
          KS="$PWD/ci/thelastmemory.keystore"
          test -f "$KS" || { echo "::error::مفتاح التوقيع الثابت مفقود من المستودع"; exit 1; }
          mkdir -p "$CFG_DIR"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            "export/android/debug_keystore = \"$KS\"" \
            'export/android/debug_keystore_user = "thelastmemory"' \
            'export/android/debug_keystore_pass = "thelastmemory"' \
            > "$CFG"
          echo "--- $CFG ---"
          cat "$CFG"
          echo "--- بصمة المفتاح المستخدم ---"
          keytool -list -v -keystore "$KS" -storepass thelastmemory 2>/dev/null \
            | grep -E "SHA256:|Valid from"

      - name: تسخين ذاكرة الاستيراد
        run: |
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --path . --import

      - name: اختبار نهائي — تصدير نسخة مصدَّرة وتشغيلها
        # أقوى اختبار ممكن دون جهاز: نصدّر نسخة Linux من نفس المشروع
        # ونشغّلها فعلياً. هذا يختبر الحزمة المصدَّرة لا مجلد المشروع،
        # فيكشف أخطاء التصدير نفسه مثل مشهد رئيسي مفقود أو مورد مستبعد.
        run: |
          set -e
          export PATH="$HOME/godot-bin:$PATH"
          mkdir -p build/linux
          godot --headless --path . --export-debug "LinuxTest" build/linux/smoke_test.x86_64
          test -s build/linux/smoke_test.x86_64 || { echo "::error::لم تُنتَج نسخة الاختبار"; exit 1; }
          chmod +x build/linux/smoke_test.x86_64
          OUT=$(./build/linux/smoke_test.x86_64 --headless --quit-after 180 2>&1) || {
            echo "::error::النسخة المصدَّرة خرجت بخطأ"; echo "$OUT" | tail -20; exit 1; }
          echo "$OUT" | tail -5
          if echo "$OUT" | grep -qiE "Can't run project|no main scene|SCRIPT ERROR|Failed to load"; then
            echo "::error::النسخة المصدَّرة أقلعت بأخطاء"
            echo "$OUT" | grep -iE "Can't run project|no main scene|SCRIPT ERROR|Failed to load" | head -5
            exit 1
          fi
          echo "النسخة المصدَّرة أقلعت وعملت 180 إطاراً بلا أخطاء"

      - name: تصدير APK (release موقّع بالمفتاح الثابت)
        # --export-release بدل --export-debug: يزيل android:debuggable
        # الذي يبطّئ التشغيل ويستفز Play Protect.
        # versionCode = 100 + رقم التشغيل: يضمن تصاعداً دائماً فوق أي
        # إصدار سابق، وبدونه لا يعتبر أندرويد الحزمة تحديثاً.
        run: |
          set -e
          export PATH="$HOME/godot-bin:$PATH"
          KS="$PWD/ci/thelastmemory.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$KS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="thelastmemory"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="thelastmemory"
          VC=$(( 100 + GITHUB_RUN_NUMBER ))
          sed -i "s|^version/code=.*|version/code=${VC}|" export_presets.cfg
          sed -i "s|res://ci/thelastmemory.keystore|${KS}|g" export_presets.cfg
          echo "versionCode = ${VC}"
          grep -E "^version/|^keystore/" export_presets.cfg
          mkdir -p build/android
          godot --headless --path . --export-release "Android" build/android/the_last_memory.apk
          test -s build/android/the_last_memory.apk \
            || { echo "::error::لم يُنتَج ملف APK"; exit 1; }
          ls -lh build/android/

      - name: التحقق من ثبات التوقيع
        # الحارس الذي يمنع تكرار العطل: إذا تغيّرت بصمة الشهادة
        # عن المفتاح الثابت، يفشل البناء بدل أن يَصدُر APK لا يُثبَّت.
        run: |
          set -e
          APK=build/android/the_last_memory.apk
          EXPECTED="7DF505367E565CABEBC372483DAEA170A94DAD1DB9C6FDC413B6FFEBBB07DF7C"
          # apksigner هو الأداة الصحيحة: يقرأ توقيع v1 وv2 وv3 معاً.
          # قراءة META-INF مباشرة لا تصلح — apksigner يتخطى توقيع v1
          # عندما يكون minSdk ≥ 24، فلا يوجد ملف .RSA أصلاً.
          AS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$AS" || { echo "::error::apksigner غير موجود"; exit 1; }
          echo "--- apksigner verify ---"
          "$AS" verify --verbose --print-certs "$APK" | tee /tmp/sigout.txt
          # build-tools 36 يطبع "V3.0 Signer: certificate SHA-256 digest:"
          # أما الصيغ الأقدم فتطبع "Signer #1 certificate SHA-256 digest:".
          # لذا نطابق الجزء الثابت وحده.
          GOT=$(grep -iE "certificate SHA-256 digest" /tmp/sigout.txt \
                | head -1 | sed 's/.*digest: *//' | tr -d ' :' | tr 'a-f' 'A-F')
          test -n "$GOT" || { echo "::error::تعذّرت قراءة بصمة الشهادة"; exit 1; }
          echo "المتوقَّع: $EXPECTED"
          echo "الفعلي  : $GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::بصمة التوقيع لا تطابق المفتاح الثابت — الحزمة لن تُثبَّت فوق نسخة سابقة"
            exit 1
          fi
          echo "التوقيع ثابت ومطابق"
          if unzip -p "$APK" AndroidManifest.xml | strings | grep -q "debuggable"; then
            echo "::warning::ما زال debuggable مذكوراً في البيان"
          else
            echo "نسخة release — بلا debuggable"
          fi

      - name: التحقق من بنية الـ APK
        # لا نكتفي بوجود الملف: نفحص أنه أرشيف أندرويد حقيقي
        run: |
          set -e
          APK=build/android/the_last_memory.apk
          file "$APK"
          MISSING=0
          for entry in AndroidManifest.xml classes.dex; do
            unzip -l "$APK" | grep -q "$entry" || { echo "::error::ناقص: $entry"; MISSING=1; }
          done
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so" \
            || { echo "::error::مكتبة المحرك لأجهزة arm64 ناقصة"; MISSING=1; }
          unzip -l "$APK" | grep -qE "assets/.*\.pck|assets/_cl_" \
            || echo "::warning::لم يُعثر على حزمة الموارد بالاسم المتوقع"
          unzip -l "$APK" | grep -q "META-INF/" || { echo "::error::الـ APK غير موقّع"; MISSING=1; }
          MAIN=$(grep -oP 'run/main_scene="res://\K[^"]+' project.godot || true)
          test -n "$MAIN" || { echo "::error::لا مشهد رئيسي في project.godot"; MISSING=1; }
          BASE=$(basename "$MAIN" .tscn)
          unzip -l "$APK" | grep -q "$BASE" \
            || { echo "::error::المشهد الرئيسي $MAIN غير موجود داخل الـ APK"; MISSING=1; }
          echo "المشهد الرئيسي داخل الحزمة: $MAIN"
          echo "عدد المدخلات: $(unzip -l "$APK" | tail -1)"
          exit $MISSING

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: the-last-memory-apk
          path: build/android/the_last_memory.apk
          retention-days: 90

      - name: نشر الـ APK في إصدار متجدّد
        # الفرع العادي يرفض أكثر من 100 ميغابايت (GH001)، وهو ما كان
        # يُفشل كل بناء منذ أن تجاوز الـAPK هذا الحدّ. إصدارات GitHub
        # تقبل حتى 2 غيغابايت للملف الواحد، وتُخدَم برابط مباشر ثابت
        # يدعم الاستئناف — وهو ما يلزم للتنزيل على الجوال.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=build/android/the_last_memory.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          VER=$(tr -d ' \n\r' < VERSION 2>/dev/null || echo "0.0.0")
          TAG="latest-build"
          NOTES=$(printf '%s\n' \
            "الإصدار: $VER" \
            "الالتزام: ${GITHUB_SHA:0:7}" \
            "التاريخ: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "الحجم: $SIZE بايت" \
            "SHA256: $SHA")
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "آخر بناء — $VER (${GITHUB_SHA:0:7})" \
            --notes "$NOTES" --latest
          {
            echo "## رابط التنزيل المباشر"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/the_last_memory.apk"
            echo
            echo "- الحجم: **$SIZE** بايت"
            echo "- SHA256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "الحجم: $SIZE"
          echo "SHA256: $SHA"
