# ===================================================================
# بناء APK آلياً لـ THE LAST MEMORY
# ===================================================================
# الحالة: غير مُختبَر. لم يُشغَّل هذا الملف ولو مرة واحدة.
#
# التشغيل يدوي فقط (workflow_dispatch) ولا يعمل تلقائياً عند الدفع.
# هذا متعمد: لا نبني APK قبل إثبات أن المشروع يُستورد ويُصدَّر
# على الجهاز في المهام 0.6 و 0.8.
#
# شرط مسبق إلزامي: وجود ملف export_presets.cfg في جذر المشروع،
# يولّده محرر Godot عند إنشاء إعداد تصدير أندرويد. لا يمكن كتابته
# يدوياً بثقة، لذا يُنشأ على الجهاز في المهمة 0.8 ثم يُدفع.
# ===================================================================

name: Android Build

on:
  workflow_dispatch:
    inputs:
      preset_name:
        description: "اسم إعداد التصدير كما هو في export_presets.cfg"
        required: true
        default: "Android"

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: التحقق من وجود إعداد التصدير
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg غير موجود."
            echo "أنشئ إعداد تصدير أندرويد داخل محرر Godot على الجهاز (المهمة 0.8) ثم ادفعه."
            exit 1
          fi
          echo "تم العثور على export_presets.cfg"

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت أدوات Android SDK
        uses: android-actions/setup-android@v3

      - name: تنزيل محرك Godot وقوالب التصدير
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download"
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          wget -q "${BASE}/${TAG}/Godot_v${TAG}_linux.x86_64.zip" -O godot.zip
          wget -q "${BASE}/${TAG}/Godot_v${TAG}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          mv Godot_v${TAG}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/
          godot --version

      - name: ربط Godot بالـ SDK و JDK
        run: |
          set -e
          CFG_DIR=~/.config/godot
          mkdir -p "$CFG_DIR"
          cat > "$CFG_DIR/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: تسخين ذاكرة الاستيراد
        # بدون هذه الخطوة ينهار Godot في الوضع الرأسي عند أول تصدير
        run: godot --headless --editor --quit || true

      - name: تثبيت قالب بناء أندرويد وتصدير APK
        run: |
          set -e
          mkdir -p build/android
          godot --headless --verbose \
            --install-android-build-template \
            --export-debug "${{ inputs.preset_name }}" \
            build/android/the_last_memory.apk
          test -f build/android/the_last_memory.apk \
            || { echo "::error::لم يُنتَج ملف APK"; exit 1; }
          ls -lh build/android/

      - name: رفع الـ APK كملف قابل للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: the-last-memory-debug-apk
          path: build/android/the_last_memory.apk
          retention-days: 30
