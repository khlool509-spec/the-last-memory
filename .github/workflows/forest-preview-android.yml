name: Forest Integration Android APK

on:
  push:
    branches:
      - integration/forest-godot4
      - work/forest-spawn-modmenu-final
    paths:
      - ".github/workflows/forest-preview-android.yml"
      - "FOREST_PREVIEW.md"
      - "src/levels/forest_preview.gd"
      - "levels/ch01_forest/forest_preview.tscn"
      - "project.godot"
      - "src/levels/game_level.gd"
      - "src/player/player.gd"
      - "src/story/chapters.gd"
      - "tests/gameplay_test.gd"
      - "tests/world_test.gd"
      - "tests/run.sh"
      - "tests/forest_preview_test.gd"
      - "tests/forest_preview_test.tscn"
      - "archive/legacy_generated_forest/**"
      - "levels/ch01_forest/chapter_one.tscn"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forest-integration:
    name: Build playable forest integration APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: stable
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download Forest-Godot4 source
        run: |
          set -e
          git clone --depth 1 https://github.com/Lakshman-YT/Forest-Godot4.git forest_preview

      - name: Bring authored forest and all required dependencies into THE LAST MEMORY
        run: |
          set -e
          # Copy the complete authored world dependencies, not only its visible meshes.
          rm -rf ./world.tscn "./env models" "./terrain mat" ./terrain_Data ./character "./\$lib"
          cp -a forest_preview/world.tscn ./world.tscn
          cp -a "forest_preview/env models" "./env models"
          cp -a "forest_preview/terrain mat" "./terrain mat"
          cp -a forest_preview/terrain_Data ./terrain_Data
          cp -a forest_preview/character ./character
          cp -a "forest_preview/\$lib" "./\$lib"
          mkdir -p addons
          cp -a forest_preview/addons/. addons/

          # The authored world contains Phantom Camera nodes. Register the manager
          # explicitly because this clean CI project does not enable the editor plugin.
          test -s addons/phantom_camera/scripts/managers/phantom_camera_manager.gd
          python3 - <<'PY'
          from pathlib import Path
          project = Path("project.godot")
          data = project.read_text(encoding="utf-8")
          marker = "[autoload]\n"
          entry = 'PhantomCameraManager="*res://addons/phantom_camera/scripts/managers/phantom_camera_manager.gd"'
          if marker not in data:
              raise SystemExit("project.godot has no [autoload] section")
          if entry not in data:
              data = data.replace(marker, marker + entry + "\n", 1)
          project.write_text(data, encoding="utf-8")
          if entry not in project.read_text(encoding="utf-8"):
              raise SystemExit("PhantomCameraManager autoload was not registered")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          # Repair exported OBJ material libraries that still point to the author's Windows drive.
          # All replacement textures below are present in Forest-Godot4.
          mappings = {
              "C:/Users/Admin/Documents/terrain/terrain mat/ground text/rock text/Rocks007_1K-JPG_Color.jpg":
                  Path("terrain mat/ground text/rock text/Rocks007_1K-JPG_Color.jpg"),
              "D:/assets/extracted/rocks/rock 1/textures/procedural_rocks2_Base_Color.png":
                  Path("env models/rocks/texture/rock 2 base.jpg"),
              "D:/assets/extracted/rocks/rock 1/textures/procedural_rocks2_Roughness.png":
                  Path("env models/rocks/texture/rock 2 roughness.jpg"),
              "D:/assets/extracted/rocks/rock 1/textures/procedural_rocks2_Normal_OpenGL.png":
                  Path("env models/rocks/texture/rock 2 normal.jpg"),
              "D:/assets/extracted/rocks/rock 1/textures/procedural_rocks10_Base_Color.png":
                  Path("env models/rocks/texture/rock 2 base.jpg"),
              "D:/assets/extracted/rocks/rock 1/textures/procedural_rocks10_Roughness.png":
                  Path("env models/rocks/texture/rock 2 roughness.jpg"),
              "D:/assets/extracted/rocks/rock 2/textures/COLOR.tga.png":
                  Path("env models/rocks/texture/rock 2 base.jpg"),
              "D:/assets/extracted/MAPLE/source/acer_roughness.png":
                  Path("env models/plants/tree/textures/maple_bark_roughness.jpg"),
              "D:/assets/extracted/MAPLE/source/acer_normal.png":
                  Path("env models/plants/tree/textures/maple_bark_normal.jpg"),
              "D:/assets/extracted/pine/textures/Bark_basecolor.png":
                  Path("env models/plants/tree/textures/pine_bark_base.jpg"),
              "D:/assets/extracted/pine/source/Substance_graph_roughness.png":
                  Path("env models/plants/tree/textures/pine_bark_roughness.jpg"),
              "D:/assets/extracted/pine/source/Substance_graph_normal.png":
                  Path("env models/plants/tree/textures/pine_bark_normal.jpg"),
              "D:/assets/extracted/pine/textures/Pine_large_3_Billboard_SS.png":
                  Path("env models/plants/tree/textures/pine_leaf_ao.jpg"),
              "D:/assets/extracted/liliac/source/Lilac_bark_roughness_2k.png":
                  Path("env models/plants/bush/textures/Lilac_bark_roughness.jpg"),
              "D:/assets/extracted/liliac/source/Lilac_bark_normal_2k.png":
                  Path("env models/plants/bush/textures/Lilac_bark_normal.jpg"),
              "D:/assets/extracted/liliac/source/Textures cards/lilac_cards_Roughness.png":
                  Path("env models/plants/bush/textures/lilac_cards_roughness.jpg"),
              "D:/assets/extracted/liliac/source/Textures cards/lilac_cards_Normal.png":
                  Path("env models/plants/bush/textures/lilac_cards_normal.jpg"),
              "C:/Roughness.png":
                  Path("env models/plants/grass/textures/fern_roughness.jpg"),
              "C:/Normal.png":
                  Path("env models/plants/grass/textures/fern_normal.jpg"),
          }

          # Resolve only files that exist in the checked-out source. Unsupported
          # external opacity maps are dropped rather than left as broken paths.
          for mtl in Path("env models").rglob("*.mtl"):
              rewritten = []
              for line in mtl.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.lstrip().startswith("map_d ") and ("D:/" in line or "C:/" in line):
                      continue
                  for old, target in mappings.items():
                      if old in line:
                          if not target.is_file():
                              raise SystemExit(f"Replacement texture is missing: {target}")
                          line = line.replace(old, os.path.relpath(target, mtl.parent))
                  rewritten.append(line)
              mtl.write_text("\n".join(rewritten) + "\n", encoding="utf-8")

          for folder in [Path("env models"), Path("terrain mat"), Path("addons")]:
              for path in folder.rglob("*"):
                  if path.is_file() and path.suffix.lower() in {".mtl", ".tscn", ".tres", ".gd", ".cfg", ".gdshader", ".gdshaderinc"}:
                      data = path.read_text(encoding="utf-8", errors="ignore")
                      if re.search(r"(?<![A-Za-z0-9_])[A-Za-z]:[/\\]", data):
                          raise SystemExit(f"Unresolved Windows asset path in {path}")
          PY

          test -s world.tscn
          test -s terrain_Data/terrain3d_00_00.res
          test -s addons/terrain_3d/terrain.gdextension
          test -s addons/terrain_3d/bin/libterrain.android.debug.arm64.so
          test -s addons/terrain_3d/bin/libterrain.android.release.arm64.so
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;36.0.0" "platforms;android-35"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.7.2 and export templates
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 755 "/tmp/godot/Godot_v${TAG}_linux.x86_64" "$HOME/godot-bin/godot"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          export PATH="$HOME/godot-bin:$PATH"
          godot --version

      - name: Create clean Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="docs/*,tests/*,tools/*,shots/*,*.md,*.sh,VERSION"
          export_path="build/the_last_memory_forest.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=16
          version/name="0.15.1-forest-release-install-fix"
          launcher_icons/main_192x192="res://assets/textures/icon/icon_192.png"
          launcher_icons/adaptive_foreground_432x432="res://assets/textures/icon/icon_fg_432.png"
          launcher_icons/adaptive_background_432x432="res://assets/textures/icon/icon_bg_432.png"
          package/unique_name="com.novence.thelastmemory"
          package/name="THE LAST MEMORY"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          permissions/custom_permissions=PackedStringArray()
          EOF
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          sed -i "s|^version/code=.*|version/code=${VERSION_CODE}|" export_presets.cfg
          echo "Android versionCode=${VERSION_CODE}"

      - name: Verify Terrain3D Android ARM64 native library
        run: |
          set -e
          test -f addons/terrain_3d/bin/libterrain.android.debug.arm64.so
          test -f addons/terrain_3d/bin/libterrain.android.release.arm64.so
          grep -q 'android.debug.arm64' addons/terrain_3d/terrain.gdextension
          grep -q 'android.release.arm64' addons/terrain_3d/terrain.gdextension

      - name: Import and validate THE LAST MEMORY + authored forest
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          godot --headless --editor --path . --import
          godot --headless --path . --quit-after 20 --rendering-method mobile

      - name: Verify Terrain3D spawn, collision, and touch controls
        run: |
          set -e
          godot --headless --path . res://tests/forest_preview_test.tscn

      - name: Run complete project regression suite
        run: |
          bash tests/run.sh

      - name: Verify stable project signing key
        run: |
          set -e
          test -s ci/thelastmemory.keystore
          keytool -list -keystore ci/thelastmemory.keystore -storepass thelastmemory -alias thelastmemory >/dev/null
      - name: Export, align, sign, and validate Android APK
        run: |
          set -euo pipefail
          mkdir -p build ci/apk-root/lib/arm64-v8a
          APK="build/the_last_memory_forest.apk"
          UNSIGNED="build/the_last_memory_forest-unsigned.apk"
          ALIGNED="build/the_last_memory_forest-aligned.apk"
          GODOT_BIN="$ANDROID_HOME/build-tools/36.0.0"
          # Export the optimized release template; do not ship a debug export.
          godot --headless --verbose --path . --export-release "Android" "$UNSIGNED"
          test -s "$UNSIGNED"

          # Add the Terrain3D runtime libraries before final APK alignment.
          # Release export resolves the release GDExtension binary only.
          cp addons/terrain_3d/bin/libterrain.android.release.arm64.so ci/apk-root/lib/arm64-v8a/
          file ci/apk-root/lib/arm64-v8a/libterrain.android.release.arm64.so
          (cd ci/apk-root && zip -q -0 -u ../../"$UNSIGNED" lib/arm64-v8a/libterrain.android.release.arm64.so)

          # zip -u changes the APK after Godot's own alignment pass. Re-align
          # the complete archive (including the newly added .so files) before signing.
          # Align uncompressed native libraries on 16 KB boundaries for modern Android devices.
          "$GODOT_BIN/zipalign" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$GODOT_BIN/zipalign" -c -P 16 -v 4 "$ALIGNED"

          # Use the repository's permanent project keystore so future updates
          # have the same signing certificate instead of a new random key per build.
          "$GODOT_BIN/apksigner" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --ks ci/thelastmemory.keystore --ks-pass pass:thelastmemory \
            --ks-key-alias thelastmemory --key-pass pass:thelastmemory --out "$APK" "$ALIGNED"
          "$GODOT_BIN/apksigner" verify --verbose --print-certs "$APK"
          "$GODOT_BIN/zipalign" -c -P 16 -v 4 "$APK"

          # Validate the APK archive and Android manifest/package metadata.
          unzip -tq "$APK" >/dev/null
          "$GODOT_BIN/aapt2" dump badging "$APK" > build/apk-badging.txt
          cat build/apk-badging.txt
          grep -q "package: name='com.novence.thelastmemory'" build/apk-badging.txt
          grep -q "^sdkVersion:'[0-9]" build/apk-badging.txt
          grep -q "^targetSdkVersion:'[0-9]" build/apk-badging.txt
          "$GODOT_BIN/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > build/apk-manifest.txt
          grep -q 'E: manifest' build/apk-manifest.txt
          unzip -Z1 "$APK" > build/apk-file-list.txt
          grep -qx 'AndroidManifest.xml' build/apk-file-list.txt
          grep -qx 'lib/arm64-v8a/libgodot_android.so' build/apk-file-list.txt
          ! grep -qx 'lib/arm64-v8a/libterrain.android.debug.arm64.so' build/apk-file-list.txt
          grep -qx 'lib/arm64-v8a/libterrain.android.release.arm64.so' build/apk-file-list.txt
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-last-memory-forest-android-apk
          path: build/the_last_memory_forest.apk
          retention-days: 30

      - name: Publish downloadable preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="forest-spawn-fix-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/the_last_memory_forest.apk \
            --title "THE LAST MEMORY - Terrain3D Spawn Fix" \
            --notes "Playable Android preview: authored Forest-Godot4 terrain/foliage with THE LAST MEMORY mobile player and HUD. Integration branch only." \
            --latest=false
