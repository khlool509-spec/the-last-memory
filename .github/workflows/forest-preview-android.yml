name: Forest Integration Android APK

on:
  push:
    branches:
      - integration/forest-godot4
    paths:
      - ".github/workflows/forest-preview-android.yml"
      - "FOREST_PREVIEW.md"
      - "src/levels/forest_preview.gd"
      - "levels/ch01_forest/forest_preview.tscn"
      - "project.godot"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forest-integration:
    name: Build playable forest integration APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: stable
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/forest-godot4

      - name: Download Forest-Godot4 source
        run: |
          set -e
          git clone --depth 1 https://github.com/Lakshman-YT/Forest-Godot4.git forest_preview

      - name: Bring authored forest into THE LAST MEMORY
        run: |
          set -e
          # Preserve the forest project's res:// paths so world.tscn remains intact.
          cp -a forest_preview/world.tscn ./world.tscn
          cp -a "forest_preview/env models" "./env models"
          cp -a "forest_preview/terrain mat" "./terrain mat"
          mkdir -p addons
          cp -a forest_preview/addons/sky_3d addons/
          cp -a forest_preview/addons/terrain_3d addons/
          # The source project contains a demo player/UI; our preview script removes
          # those nodes at runtime and uses THE LAST MEMORY's mobile Player + HUD.
          find "env models" "terrain mat" addons/sky_3d addons/terrain_3d -type f \
            \( -name "*.tscn" -o -name "*.tres" -o -name "*.gd" -o -name "*.cfg" \) \
            -print0 | xargs -0 grep -Il "D:/" 2>/dev/null | while read -r f; do
              sed -i 's|D:/assets/|res://|g; s|D:\\\\assets\\\\|res://|g' "$f"
            done || true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.7.2 and export templates
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 755 "/tmp/godot/Godot_v${TAG}_linux.x86_64" "$HOME/godot-bin/godot"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          export PATH="$HOME/godot-bin:$PATH"
          godot --version

      - name: Create clean Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="docs/*,tests/*,tools/*,shots/*,*.md,*.sh,VERSION"
          export_path="build/the_last_memory_forest.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=15
          version/name="0.14.0-forest"
          package/unique_name="com.novence.thelastmemory.forest"
          package/name="THE LAST MEMORY"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          user_data_backup/allow=false
          command_line/extra_args=""
          permissions/custom_permissions=PackedStringArray()
          EOF

      - name: Verify Terrain3D Android ARM64 native library
        run: |
          set -e
          test -f addons/terrain_3d/bin/libterrain.android.debug.arm64.so
          test -f addons/terrain_3d/bin/libterrain.android.release.arm64.so
          grep -q 'android.debug.arm64' addons/terrain_3d/terrain.gdextension
          grep -q 'android.release.arm64' addons/terrain_3d/terrain.gdextension

      - name: Configure Mobile renderer and 60 FPS cap
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          s = p.read_text()
          if "[display]" not in s:
              s += "\n[display]\n\n[display/window]\n\n[display/window/size]\n"
          if "renderer/rendering_method" not in s:
              s += "\n[rendering]\n\nrenderer/rendering_method="mobile"\nrenderer/rendering_method.mobile="mobile"\n"
          if "application/run/main_scene" not in s:
              pass
          if "application/config/name" in s and "display/window/size/viewport_width" not in s:
              s += "\n[display/window]\nsize/viewport_width=1920\nsize/viewport_height=1080\n"
          s += "\n[display/window]\n\n[display/window/stretch]\nmode="canvas_items"\n"
          if "application/run/main_scene" not in s:
              pass
          # Godot's 60 FPS cap is applied at runtime by the project.
          if "application/config/name" in s and "run/max_fps" not in s:
              s += "\n[application]\n\nrun/max_fps=60\n"
          p.write_text(s)
          PY

      - name: Import and validate THE LAST MEMORY + authored forest
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.7.tres"
          godot --headless --editor --path . --import
          godot --headless --path . --quit-after 20

      - name: Create Android debug.keystore and signing config
        run: |
          set -e
          mkdir -p ci build
          keytool -genkeypair -v -keystore ci/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          cp ci/debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 ci/debug.keystore

      - name: Export playable Android APK (arm64)
        run: |
          set -e
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/the_last_memory_forest-unsigned.apk
          test -s build/the_last_memory_forest-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ci/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out build/the_last_memory_forest.apk build/the_last_memory_forest-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs build/the_last_memory_forest.apk
          test -s build/the_last_memory_forest.apk
          file build/the_last_memory_forest.apk
          unzip -l build/the_last_memory_forest.apk | grep -q "AndroidManifest.xml"
          unzip -l build/the_last_memory_forest.apk | grep -q "lib/arm64-v8a/libgodot_android.so"
          unzip -l build/the_last_memory_forest.apk | grep -q "lib/arm64-v8a/libterrain.android.release.arm64.so"
          ls -lh build/the_last_memory_forest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-last-memory-forest-android-apk
          path: build/the_last_memory_forest.apk
          retention-days: 30

      - name: Publish downloadable preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="forest-integration-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/the_last_memory_forest.apk \
            --title "THE LAST MEMORY - Forest Integration" \
            --notes "Playable Android preview: authored Forest-Godot4 terrain/foliage with THE LAST MEMORY mobile player and HUD. Integration branch only." \
            --latest=false
