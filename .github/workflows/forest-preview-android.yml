name: Forest Preview Android APK

on:
  push:
    branches:
      - integration/forest-godot4
    paths:
      - ".github/workflows/forest-preview-android.yml"
      - "FOREST_PREVIEW.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-forest-preview:
    name: Build standalone forest preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: "4.6.3"
      GODOT_STATUS: stable
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4
        with:
          ref: integration/forest-godot4

      - name: Download Forest-Godot4 source
        run: |
          set -e
          git clone --depth 1 https://github.com/Lakshman-YT/Forest-Godot4.git forest_preview

      - name: Configure forest for Android Mobile renderer
        run: |
          set -e
          cd forest_preview
          if ! grep -q '^renderer/rendering_method=' project.godot; then
            cat >> project.godot <<'EOF'

          [rendering]
          renderer/rendering_method="mobile"
          renderer/rendering_method.mobile="mobile"
          EOF
          fi
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter="images/*,*.md,*.txt"
          export_path="../build/forest_preview.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="0.1.0"
          package/unique_name="com.novence974.forestpreview"
          package/name="THE LAST MEMORY - Forest Preview"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          permissions/custom_permissions=PackedStringArray()
          EOF
          # Reuse the project's proven Android preset, then adapt it for the isolated forest app.
          cp ../export_presets.cfg export_presets.cfg
          sed -i 's|^export_path=.*|export_path="../build/forest_preview.apk"|' export_presets.cfg
          sed -i 's|^package/unique_name=.*|package/unique_name="com.novence974.forestpreview"|' export_presets.cfg
          sed -i 's|^package/name=.*|package/name="THE LAST MEMORY - Forest Preview"|' export_presets.cfg
          sed -i 's|^package/signed=.*|package/signed=false|' export_presets.cfg
          sed -i '/^keystore\//d; /^launcher_icons\//d' export_presets.cfg

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Install Godot 4.6.3 and export templates
        run: |
          set -e
          TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          mkdir -p "$HOME/godot-bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 755 "/tmp/godot/Godot_v${TAG}_linux.x86_64" "$HOME/godot-bin/godot"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/$TAG/Godot_v${TAG}_export_templates.tpz"
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          export PATH="$HOME/godot-bin:$PATH"
          godot --version

      - name: Import and validate forest project
        run: |
          set -e
          godot --headless --editor --path forest_preview --import
          godot --headless --path forest_preview --quit-after 30

      - name: Export Android APK (arm64)
        run: |
          set -e
          mkdir -p build
          mkdir -p "$HOME/.config/godot"
          printf '%s\n' \
            '[gd_resource type="EditorSettings" format=3]' \
            '' \
            '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\"" \
            "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > "$HOME/.config/godot/editor_settings-4.6.tres"
          echo "--- Android export preset ---"
          sed -n '/^\[preset.0\]/,/^\[preset.1\]/p' forest_preview/export_presets.cfg
          godot --headless --verbose --path forest_preview --export-debug "Android" build/forest_preview.apk
          test -s build/forest_preview.apk
          file build/forest_preview.apk
          unzip -l build/forest_preview.apk | grep -q "AndroidManifest.xml"
          unzip -l build/forest_preview.apk | grep -q "lib/arm64-v8a/libgodot_android.so"
          ls -lh build/forest_preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forest-preview-android-apk
          path: build/forest_preview.apk
          retention-days: 30

      - name: Publish downloadable preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="forest-preview-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" build/forest_preview.apk \
            --title "THE LAST MEMORY - Forest Preview APK" \
            --notes "Standalone visual preview of Forest-Godot4. This is not yet integrated with the THE LAST MEMORY player, story, or gameplay systems." \
            --latest=false
